server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress the bundle. It is ~757 kB uncompressed and ~207 kB gzipped.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed filenames make these safe to cache indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached: it is the only file whose name is stable
    # across deploys, so a cached copy keeps pointing at deleted asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing: unknown paths are React Router's to resolve, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
